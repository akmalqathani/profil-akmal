    <script>
        function copyEmail(event, emailAddress) {
            // Mencegah halaman melompat/refresh
            event.preventDefault(); 
            
            // Menyalin teks ke clipboard
            navigator.clipboard.writeText(emailAddress).then(function() {
                // Mencari elemen span dengan class 'handle' di dalam card yang diklik
                const handleElement = event.currentTarget.querySelector('.handle');
                const originalText = handleElement.innerText;
                
                // Ubah teks menjadi indikator sukses
                handleElement.innerText = "Tersalin!";
                
                // Kembalikan ke teks semula setelah 2 detik
                setTimeout(function() {
                    handleElement.innerText = originalText;
                }, 2000);
            }).catch(function(err) {
                alert('Gagal menyalin email: ' + err);
            });
        }
    </script>
